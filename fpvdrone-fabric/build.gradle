plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	mods {
		"fpvdrone" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"
	// In-game test with the owner's renderer mods (never a build dependency of the mod):
	//   tools/run-smoke.sh -PwithSodium      Sodium 0.9.2 for 26.3
	//   tools/run-smoke.sh -PwithIris        Sodium + Iris 1.11.7 for 26.3
	if (project.hasProperty('withSodium') || project.hasProperty('withIris')) {
		localRuntime "maven.modrinth:sodium:bAZQdGpg"
	}
	if (project.hasProperty('withIris')) {
		localRuntime "maven.modrinth:iris:vTN4NRGW"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xmaxerrs', '5000']
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Isolated integration test mod: never included in the distributable jar.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    servertest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        fpvdrone_smoke { sourceSet sourceSets.smoke }
        fpvdrone_servertest { sourceSet sourceSets.servertest }
    }
    runs {
        smoke {
            client()
            source sourceSets.smoke
            runDir 'build/smoke-run'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=fpvdrone_smoke'
        }
        // Dedicated-server boot check (no client classes): tools/run-server-check.sh
        serverCheck {
            server()
            source sourceSets.servertest
            runDir 'build/server-run'
            vmArg '-Dfabric-api.gametest'
        }
    }
}
